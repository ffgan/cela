name: Deploy zola-theme-cela to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install CSS tooling
        run: npm ci

      - name: Build generated scripts and CSS
        run: npm run build:js && npm run build:css

      # install zola via install-action
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      # build zola static site
      - name: Build site
        run: zola build

      - name: Copy KaTeX into the demo output
        run: mkdir -p public/js/vendor && cp -a vendor/katex public/js/vendor/katex

      # deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public  # Zola default public folder
