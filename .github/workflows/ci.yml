name: zola-themes-cela-ci

on:
  pull_request:
  push:
    branches: [ main, master, ffgan-blog ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install CSS tooling
        run: npm ci

      - name: Typecheck and test scripts
        run: npm run typecheck && npm test

      - name: Build generated scripts
        run: npm run build:js

      - name: Confirm generated scripts are committed
        run: git diff --exit-code -- static/js templates/partials/generated

      - name: Build generated CSS
        run: npm run build:css:min

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Check site
        run: zola check --skip-external-links

      - name: Zola build
        run: zola build

      - name: Copy KaTeX into the demo output
        run: mkdir -p public/js/vendor && cp -a vendor/katex public/js/vendor/katex
