{% extends 'index.html' %}
{% block main %}

<!-- robot header -->
<header class="page-header">
    <nav class="breadcrumbs" aria-label="breadcrumb">
        <a href="{{ config.base_url }}">Home</a>
    </nav>
    <h1>{{ section.title }}
      {{ macro_extra_icon::extra_icon(icon="robot", size="24") }}
  </h1>
</header>

<!-- robot items -->
<div class="post-entry robot-tool-card">
  <header class="entry-header robot-card-header">
    <h2>Crypto Tools</h2>
  </header>
  <div class="tool-section">
    <div class="tool-label">
      <h4>Base64 En/Decode</h4>
    </div>
    <div class="tool-inputs">
      <div class="input-group">
        <input aria-label="Text to encode" placeholder="Text to encode">
        <div class="button-container">
          <button type="button" aria-label="Encode to Base64" onclick="encodeBase64()">Encode</button>
        </div>
      </div>
      <div class="input-group">
        <input aria-label="Text to decode" placeholder="Text to decode">
        <div class="button-container">
          <button type="button" aria-label="Decode from Base64" onclick="decodeBase64()">Decode</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tool-section">
    <div class="tool-label">
      <h4>MD5 Hash Generator</h4>
    </div>
    <div class="tool-inputs">
      <div class="input-group">
        <input aria-label="Text to hash" placeholder="Text to hash">
        <div class="button-container">
          <button type="button" aria-label="Generate MD5 hash" onclick="generateMD5()">Generate MD5</button>
        </div>
      </div>
      <div class="input-group">
        <input aria-label="MD5 hash output" placeholder="MD5 hash output" readonly>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
{{ super() }}
<script src="{{ get_url(path='js/vendor/crypto-js.js') }}"></script>
<script src="{{ get_url(path='js/robot-tools.js') }}"></script>
{% endblock %}
