<script>
  (function () {
    function normalizeScheme(value) {
      if (value === "light" || value === "dark") return value;
      return null;
    }

    var scheme = normalizeScheme(document.documentElement.getAttribute("data-scheme"));
    if (!scheme) {
      {% if config.extra.cela.color.remember_choice -%}
      try {
        scheme = normalizeScheme(localStorage.getItem("pref-scheme"));
      } catch (e) {}
      {% endif -%}
    }
    if (!scheme) {
      {% if config.extra.cela.color.default_theme == "dark" -%}
      scheme = "dark";
      {% elif config.extra.cela.color.default_theme == "light" -%}
      scheme = "light";
      {% else -%}
      scheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      {% endif -%}
    }

    document.documentElement.setAttribute("data-scheme", scheme);
    if (scheme === "dark") {
      document.documentElement.classList.add("dark");
      document.body.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
      document.body.classList.remove("dark");
    }
  })();
</script>
