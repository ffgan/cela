{% if paginator and paginator.number_pagers > 1 %}
<footer class="page-footer">
  <nav class="pagination" aria-label="Pagination">
    {% if paginator.previous %}
    <a class="previous" href="{{ paginator.previous | safe }}" rel="prev">« Previous</a>
    {% endif %}
    <span class="pagination-info">{{ paginator.current_index }} / {{ paginator.number_pagers }}</span>
    {% if paginator.next %}
    <a class="next" href="{{ paginator.next | safe }}" rel="next">Next »</a>
    {% endif %}
  </nav>
</footer>
{% endif %}
