{% set home_content = config.extra.cela.home_content | default(value="") | trim %}
{% if config.extra.cela.show_home_content | default(value=true) and home_content != "" %}
<article class="first-entry home-info home-hero reveal-on-scroll">
    <div class="entry-content">
        {{ home_content | markdown(inline=true) | safe }}
    </div>
</article>
{% endif %}
