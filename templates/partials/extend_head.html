{% if config.extra.enable_mathjax %}
  {% if page.extra.mathjax %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        enableMenu: false,
        ignoreHtmlClass: "no-mathjax",
        processHtmlClass: "mathjax"
      }
    };
  </script>
  <script defer src="{{ get_url(path='js/vendor/mathjax/tex-mml-chtml.js') }}"></script>
  {% endif %}
{% endif %}
